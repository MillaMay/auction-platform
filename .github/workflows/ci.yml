name: CI/CD Symfony Auction

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: [8.2, 8.3]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: auction_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d auction_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          extensions: pdo_pgsql, redis
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Create .env for Symfony
        run: |
          echo "APP_ENV=test" >> .env
          echo "APP_SECRET=${{ secrets.APP_SECRET }}" >> .env
          echo "DATABASE_URL=postgresql://user:pass@127.0.0.1:5432/auction_test?serverVersion=15" >> .env
          echo "REDIS_URL=redis://127.0.0.1:6379" >> .env

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run migrations
        run: |
          php bin/console doctrine:database:create --env=test --no-interaction
          php bin/console doctrine:migrations:migrate --no-interaction --env=test --quiet

      - name: Run PHPUnit
        run: php bin/phpunit --coverage-clover=coverage.clover

      - name: Static Analysis (PHPStan)
        run: |
          composer phpstan:analyze

      - name: CS Fixer
        run: |
          composer cs:fix -- --dry-run --diff

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.clover

